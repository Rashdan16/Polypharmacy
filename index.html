<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyRisk — Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --nhs-blue:#005EB8;--nhs-dark:#003D78;--nhs-light:#D5E8F5;
  --nhs-green:#007F3B;--nhs-red:#DA291C;
  --bg:#F0F4F8;--card:#FFFFFF;--text:#212B36;--text-muted:#637381;--border:#DFE3E8;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.09);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;
}

/* Header bar */
.top-bar{
  background:linear-gradient(135deg,var(--nhs-dark),var(--nhs-blue));
  padding:14px 28px;display:flex;align-items:center;gap:14px;
}
.top-bar .badge{background:#fff;color:var(--nhs-blue);font-weight:900;font-size:1.1rem;padding:5px 16px;border-radius:7px}
.top-bar p{color:rgba(255,255,255,.8);font-size:.8rem}

/* Main */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}

.login-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid var(--border);width:100%;max-width:420px;overflow:hidden;
}
.login-header{
  background:linear-gradient(135deg,var(--nhs-dark),var(--nhs-blue));
  padding:32px 32px 28px;text-align:center;
}
.login-header .icon{font-size:2.8rem;margin-bottom:10px}
.login-header h1{color:#fff;font-size:1.4rem;font-weight:700}
.login-header p{color:rgba(255,255,255,.75);font-size:.82rem;margin-top:4px}

.login-body{padding:28px 32px 32px}

.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.72rem;text-transform:uppercase;font-weight:700;color:var(--text-muted);letter-spacing:.5px;margin-bottom:6px}
.form-group input{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;
  font-size:.95rem;outline:none;transition:border .2s,box-shadow .2s;
}
.form-group input:focus{border-color:var(--nhs-blue);box-shadow:0 0 0 3px rgba(0,94,184,.15)}

.btn-login{
  width:100%;padding:13px;background:var(--nhs-blue);color:#fff;border:none;
  border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;
  transition:background .2s,transform .1s;margin-top:4px;
}
.btn-login:hover{background:var(--nhs-dark)}
.btn-login:active{transform:scale(.98)}

.error-msg{
  background:rgba(218,41,28,.07);border:1px solid rgba(218,41,28,.3);
  border-left:3px solid var(--nhs-red);color:var(--nhs-red);
  padding:10px 14px;border-radius:6px;font-size:.85rem;margin-bottom:16px;
  display:none;
}

.divider{border:none;border-top:1px solid var(--border);margin:20px 0}

.demo-hint{
  background:var(--nhs-light);border-radius:7px;padding:12px 14px;
  font-size:.78rem;color:var(--nhs-dark);line-height:1.6;
}
.demo-hint strong{font-weight:700}

/* Footer */
footer{text-align:center;padding:16px;font-size:.72rem;color:var(--text-muted)}
</style>
</head>
<body>

<div class="top-bar">
  <div class="badge">PolyRisk</div>
  <p>NHS Clinical Decision Support</p>
</div>

<main>
  <div class="login-card">
    <div class="login-header">
      <div class="icon">&#x1F512;</div>
      <h1>Sign in to PolyRisk</h1>
      <p>Polypharmacy Risk Assessment Tool</p>
    </div>
    <div class="login-body">
      <div class="error-msg" id="error-msg">&#x26A0; Incorrect username or password.</div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button class="btn-login" type="submit">Sign In</button>
      </form>

      <hr class="divider">

      <div class="demo-hint">
        <strong>Demo credentials</strong><br>
        Username: <strong>nhs.admin</strong><br>
        Password: <strong>PolyRisk2026</strong>
      </div>
    </div>
  </div>
</main>

<footer>PolyRisk &mdash; For demonstration purposes only. Not for clinical use.</footer>

<script>
// Demo users
const USERS = [
  {username: 'nhs.admin', password: 'PolyRisk2026'},
  {username: 'clinician', password: 'NHSpass1'},
];

function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error-msg');

  const match = USERS.find(u => u.username === username && u.password === password);
  if (match) {
    sessionStorage.setItem('polyrisk_auth', username);
    window.location.href = './polyrisk.html';
  } else {
    errorEl.style.display = 'block';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
}

// If already logged in, skip to app
if (sessionStorage.getItem('polyrisk_auth')) {
  window.location.href = './polyrisk.html';
}
</script>
</body>
</html>
